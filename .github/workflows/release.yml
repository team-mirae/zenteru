name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build a
# universal zenteru.app and publish a GitHub release. install.sh downloads
# from the latest published release, so asset names carry no version.
#
# Signing: if the repository secrets MACOS_CERT_P12 (base64 of a .p12 with
# the certificate and private key) and MACOS_CERT_PASSWORD are set, the app
# is signed with that identity (MACOS_SIGN_IDENTITY picks one if the .p12
# holds several). Otherwise it is signed ad hoc, which is fine for the curl
# installer (curl doesn't set the quarantine flag).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable

      - name: Build universal binary
        run: |
          cargo build --release --locked -p zenteru-app --target aarch64-apple-darwin
          cargo build --release --locked -p zenteru-app --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/zenteru \
            target/aarch64-apple-darwin/release/zenteru \
            target/x86_64-apple-darwin/release/zenteru
          lipo -info target/universal/zenteru

      - name: Import signing certificate
        id: cert
        if: env.HAS_CERT == 'true'
        continue-on-error: true
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Bundle and sign
        env:
          ZENTERU_BINARY: target/universal/zenteru
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            export ZENTERU_SIGN_IDENTITY=-
          elif [ "${{ steps.cert.outcome }}" != "success" ]; then
            echo "::warning title=Signed ad hoc::The signing certificate could not be imported (wrong MACOS_CERT_PASSWORD?); this release is signed ad hoc."
            export ZENTERU_SIGN_IDENTITY=-
          elif [ -n "$MACOS_SIGN_IDENTITY" ]; then
            export ZENTERU_SIGN_IDENTITY="$MACOS_SIGN_IDENTITY"
          fi
          scripts/bundle.sh

      - name: Package
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent zenteru.app zenteru-macos-universal.zip
          shasum -a 256 zenteru-macos-universal.zip > zenteru-macos-universal.zip.sha256
          cat zenteru-macos-universal.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "zenteru $GITHUB_REF_NAME · 젠테루 · ゼンテール" --generate-notes \
            dist/zenteru-macos-universal.zip dist/zenteru-macos-universal.zip.sha256
