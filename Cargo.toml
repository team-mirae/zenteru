[workspace]
resolver = "3"
members = ["crates/zenteru-text", "crates/zenteru-term", "crates/zenteru-app"]

[workspace.package]
version = "0.1.25"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/team-mirae/zenteru"

[profile.release]
lto = true
codegen-units = 1
strip = true
